<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>iMassage</title>
<style>
  :root { --bg: #fff; --fg: #1d1d1f; --fg2: #86868b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #121214; --fg: #f5f5f7; --fg2: #8e8e93; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; -webkit-app-region: drag; }
  div { text-align: center; max-width: 380px; padding: 24px; }
  h1 { font-size: 17px; font-weight: 600; margin: 14px 0 6px; }
  p { color: var(--fg2); margin: 0; line-height: 1.45; }
  .spin { width: 22px; height: 22px; margin: 0 auto; border-radius: 50%; border: 2.5px solid var(--fg2); border-top-color: transparent; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div>
  <div class="spin"></div>
  <h1>Starting iMassage…</h1>
  <p>Waiting for the local iMassage server. If this doesn't clear, check <code>iMassage\logs\server.log</code>.</p>
</div>
</body>
</html>
