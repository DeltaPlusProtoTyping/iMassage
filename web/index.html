<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>iMassage</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-top">
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6"/><path d="M12.8 12.8l4.4 4.4"/></svg>
        <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
      </label>
      <button id="compose" class="tool" title="New Message (Ctrl+N)" aria-label="New Message">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V13"/><path d="M17.6 3.6a1.9 1.9 0 0 1 2.8 2.8L12 14.8l-3.6.8.8-3.6z"/></svg>
      </button>
    </div>
    <div id="banner" hidden></div>
    <div id="side-scroll">
      <div id="pins" hidden></div>
      <div id="chatlist" role="listbox" aria-label="Conversations"></div>
      <button id="junk-toggle" class="link-btn" hidden></button>
    </div>
  </aside>
  <div id="splitter" title="Drag to resize"></div>

  <main id="main">
    <header id="head">
      <button id="back" class="tool" aria-label="Back" title="Back">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="who" class="who" title="Details (Ctrl+I)"></button>
      <div id="new-title" hidden>New Message</div>
      <button id="find-btn" class="tool" title="Find in Conversation (Ctrl+F)" aria-label="Find in Conversation">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6"/><path d="M12.8 12.8l4.4 4.4"/></svg>
      </button>
    </header>
    <div id="find" hidden>
      <label class="search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6"/><path d="M12.8 12.8l4.4 4.4"/></svg>
        <input id="find-input" type="search" placeholder="Find in Conversation" autocomplete="off" spellcheck="false">
      </label>
      <span id="find-count"></span>
      <button id="find-prev" class="tool" title="Older (Enter)" aria-label="Older match"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <button id="find-next" class="tool" title="Newer (Shift+Enter)" aria-label="Newer match"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button id="find-done" class="link-btn">Done</button>
    </div>
    <div id="to-row" hidden>
      <span class="to-label">To:</span>
      <div id="to-chips"></div>
      <input id="to-input" placeholder="Name, phone number, or email" autocomplete="off" spellcheck="false">
      <div id="svc-pick" hidden>
        <button data-svc="iMessage" class="on">iMessage</button><button data-svc="SMS">SMS</button>
      </div>
      <div id="suggest" role="listbox" hidden></div>
    </div>

    <section id="messages"><div id="thread"></div></section>

    <footer id="composer">
      <div id="reply-banner" hidden></div>
      <div id="tray"></div>
      <div class="compose-row">
        <button id="attach" class="round-btn" title="Add photos or files" aria-label="Add photos or files">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg>
        </button>
        <div class="field" id="field">
          <textarea id="input" rows="1" placeholder="iMessage" spellcheck="true"></textarea>
          <button id="emoji" class="field-btn" title="Emoji" aria-label="Emoji">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.6 14.2c.9 1.3 2 2 3.4 2s2.5-.7 3.4-2"/><circle cx="9.3" cy="10" r=".6" fill="currentColor"/><circle cx="14.7" cy="10" r=".6" fill="currentColor"/></svg>
          </button>
          <button id="send" class="send-btn" title="Send (right-click to send later)" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18.5V6M6.8 11 12 5.8l5.2 5.2"/></svg>
          </button>
        </div>
      </div>
    </footer>

    <div id="empty">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11.5a7.5 7.5 0 0 1-10.9 6.7L4 19.5l1.3-4A7.5 7.5 0 1 1 20 11.5z"/></svg>
      <p>No Conversation Selected</p>
    </div>
    <aside id="details" aria-label="Details"></aside>
    <div id="drop" hidden><div>Drop to attach</div></div>
  </main>
</div>

<div id="lightbox" hidden>
  <div class="lb-stage"></div>
  <button class="lb-nav lb-prev" aria-label="Previous">‹</button>
  <button class="lb-nav lb-next" aria-label="Next">›</button>
  <div class="lb-bar"><span class="lb-name"></span><a class="lb-save">Save</a><button class="lb-close">Done</button></div>
</div>
<div id="menu" role="menu" hidden></div>
<div id="toast" role="status" hidden></div>
<canvas id="fx"></canvas>
<input type="file" id="file" multiple hidden>
<script src="effects.js"></script>
<script src="app.js"></script>
</body>
</html>
